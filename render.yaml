services:
  - type: web
    name: connect-t-2
    env: node
    rootDir: backend
    buildCommand: npm ci --no-audit --no-fund
    startCommand: npm start
    autoDeploy: true

  - type: web
    runtime: static
    name: connect-t-web-testing
    rootDir: mobile
    buildCommand: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund && npm run export:web
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    pullRequestPreviewsEnabled: true
    envVars:
      - key: EXPO_PUBLIC_API_URL
        fromService:
          type: web
          name: connect-t-2
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
