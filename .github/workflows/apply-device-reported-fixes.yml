name: Apply Device Reported Fixes

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'fix/remove-dashboard-sections-v109' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-dashboard-sections-v109
          fetch-depth: 0
      - name: Remove dashboard sections
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'DASHBOARD_CLEANUP_V109' mobile/app/super-admin/index.tsx 2>/dev/null; then
            echo "Dashboard cleanup already applied."
            exit 0
          fi
          python3 scripts/apply_dashboard_cleanup_v109.py
          git diff --check
          git config user.name "Connect-T Automation"
          git config user.email "actions@users.noreply.github.com"
          git add mobile
          git commit -m "Remove citizen management and dashboard search"
          git push origin HEAD:fix/remove-dashboard-sections-v109
