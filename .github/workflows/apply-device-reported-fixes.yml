name: Apply Device Reported Fixes

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'fix/jobs-single-overview-v110' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jobs-single-overview-v110
          fetch-depth: 0
      - name: Simplify Jobs dashboard
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'JOBS_SINGLE_OVERVIEW_V110' mobile/app/super-admin/jobs.tsx 2>/dev/null; then
            echo "Jobs screen already updated."
            exit 0
          fi
          python3 scripts/apply_jobs_single_overview_v110.py
          git diff --check
          git config user.name "Connect-T Automation"
          git config user.email "actions@users.noreply.github.com"
          git add mobile
          git commit -m "Simplify Jobs dashboard and show analytics inline"
          git push origin HEAD:fix/jobs-single-overview-v110
