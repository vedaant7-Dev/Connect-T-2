name: Apply Device Reported Fixes

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'fix/schema-health-v111' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/schema-health-v111
          fetch-depth: 0
      - name: Correct schema health table list
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fix_schema_health_v111.py
          git diff --check
          git config user.name "Connect-T Automation"
          git config user.email "actions@users.noreply.github.com"
          git add backend
          git commit -m "Correct Job Portal applications table in schema health"
          git push origin HEAD:fix/schema-health-v111
