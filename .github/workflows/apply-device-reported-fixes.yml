name: Apply Device Reported Fixes

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'feature/admin-users-community-v112' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-users-community-v112
          fetch-depth: 0
      - name: Apply dashboard users and community feature
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'ADMIN_USERS_COMMUNITY_V112' mobile/app/super-admin/index.tsx 2>/dev/null; then
            echo "Feature already applied."
            exit 0
          fi
          python3 scripts/apply_admin_users_community_v112.py
          sed -i 's/[[:space:]]\+$//' mobile/app/super-admin/jobs.tsx mobile/app/super-admin/index.tsx mobile/app/'(tabs)'/admin.tsx backend/server.js
          git diff --check
          git config user.name "Connect-T Automation"
          git config user.email "actions@users.noreply.github.com"
          git add backend mobile
          git commit -m "Add App Users and Nagarsevak community"
          git push origin HEAD:feature/admin-users-community-v112
