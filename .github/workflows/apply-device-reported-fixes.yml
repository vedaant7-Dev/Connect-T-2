name: Apply Device Reported Fixes

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'feature/admin-users-community-v112' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-users-community-v112
          fetch-depth: 0
      - name: Apply complete App Users and community feature
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'ADMIN_USERS_COMMUNITY_V112' mobile/app/super-admin/index.tsx 2>/dev/null; then
            python3 scripts/apply_admin_users_community_v112.py
          fi
          if ! grep -q 'APP_USERS_ALL_ROLES_V112' backend/nagarsevakCommunity.js 2>/dev/null; then
            python3 scripts/apply_all_app_users_v112.py
          fi
          sed -i 's/[[:space:]]\+$//' mobile/app/super-admin/jobs.tsx mobile/app/super-admin/index.tsx mobile/app/super-admin/users.tsx mobile/app/community.tsx mobile/app/'(tabs)'/admin.tsx backend/server.js backend/nagarsevakCommunity.js
          git diff --check
          if git diff --quiet; then
            echo "Feature already complete."
            exit 0
          fi
          git config user.name "Connect-T Automation"
          git config user.email "actions@users.noreply.github.com"
          git add backend mobile
          git commit -m "Complete all-role App Users and officer community"
          git push origin HEAD:feature/admin-users-community-v112
