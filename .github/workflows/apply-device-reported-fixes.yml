name: Apply Device Reported Fixes

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'fix/device-reported-flows-v105' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/device-reported-flows-v105
          fetch-depth: 0
      - name: Apply focused device fixes
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'DEVICE_REPORTED_FIXES_V105' mobile/components/ComplaintMediaViewer.tsx 2>/dev/null; then
            echo "Device fixes already applied."
            exit 0
          fi
          python3 scripts/apply_device_reported_fixes.py
          git diff --check
          git config user.name "Connect-T Automation"
          git config user.email "actions@users.noreply.github.com"
          git add backend mobile
          git commit -m "Fix device media, profiles, sessions and civic news"
          git push origin HEAD:fix/device-reported-flows-v105
