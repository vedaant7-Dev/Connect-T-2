name: Apply Device Reported Fixes

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'fix/jobs-dashboard-v111' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jobs-dashboard-v111
          fetch-depth: 0
      - name: Apply Jobs dashboard and citizen directory fixes
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'JOBS_DASHBOARD_V111' mobile/app/super-admin/jobs.tsx 2>/dev/null; then
            echo "Jobs dashboard fixes already applied."
            exit 0
          fi
          python3 scripts/apply_jobs_dashboard_v111.py
          git diff --check
          git config user.name "Connect-T Automation"
          git config user.email "actions@users.noreply.github.com"
          git add backend mobile
          git commit -m "Fix Jobs dashboard metrics and add paginated citizen directory"
          git push origin HEAD:fix/jobs-dashboard-v111
