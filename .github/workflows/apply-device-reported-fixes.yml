name: Apply Device Reported Fixes

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'feature/production-notifications-v108' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/production-notifications-v108
          fetch-depth: 0
      - name: Apply production notifications
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'production notification routes active' backend/notificationSystemPatch.js 2>/dev/null; then
            echo "Production notifications already applied."
            exit 0
          fi
          python3 scripts/apply_production_notifications.py
          cd mobile
          npm install --package-lock-only --ignore-scripts
          cd ..
          git diff --check
          git config user.name "Connect-T Automation"
          git config user.email "actions@users.noreply.github.com"
          git add backend mobile
          git commit -m "Enable production complaint and civic notifications"
          git push origin HEAD:feature/production-notifications-v108
