name: Quality Checks

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-lockfiles:
    name: Regenerate patched frontend lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate mobile lockfile
        working-directory: mobile
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Regenerate client lockfile
        working-directory: client
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: patched-frontend-lockfiles
          path: |
            mobile/package.json
            mobile/package-lock.json
            client/package.json
            client/package-lock.json
          retention-days: 3

  backend:
    name: Backend security and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  mobile:
    name: Mobile quality and Android/Web export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Run Expo Doctor
        shell: bash
        run: |
          set +e
          npm run doctor > doctor.log 2>&1
          status=$?
          cat doctor.log
          if [ "$status" -ne 0 ]; then
            summary=$(tail -n 12 doctor.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Expo Doctor failed::$summary"
          fi
          exit "$status"
      - name: Upload Expo Doctor diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expo-doctor-diagnostics
          path: mobile/doctor.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Run mobile regression tests
        shell: bash
        run: |
          set +e
          npm run test:api > mobile-tests.log 2>&1
          status=$?
          cat mobile-tests.log
          if [ "$status" -ne 0 ]; then
            summary=$(tail -n 30 mobile-tests.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Mobile regression tests failed::$summary"
          fi
          exit "$status"
      - name: Upload mobile regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-diagnostics
          path: mobile/mobile-tests.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Run mobile TypeScript validation
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          status=$?
          cat typecheck.log
          if [ "$status" -ne 0 ]; then
            summary=$(tail -n 20 typecheck.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Mobile TypeScript failed::$summary"
          fi
          exit "$status"
      - name: Upload mobile TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-typecheck-diagnostics
          path: mobile/typecheck.log
          if-no-files-found: ignore
          retention-days: 3
      - run: npm run export:android
      - run: npm run export:web
        env:
          EXPO_PUBLIC_API_URL: https://newapp.e-bjp.in
      - name: Capture mobile production audit
        run: npm audit --omit=dev --audit-level=high --json > mobile-audit.json || true
      - name: Upload mobile audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-audit-diagnostics
          path: mobile/mobile-audit.json
          if-no-files-found: ignore
          retention-days: 3
      - run: npm audit --omit=dev --audit-level=high

  web:
    name: Web typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Capture web production audit
        run: npm audit --omit=dev --audit-level=high --json > web-audit.json || true
      - name: Upload web audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-audit-diagnostics
          path: client/web-audit.json
          if-no-files-found: ignore
          retention-days: 3
      - run: npm audit --omit=dev --audit-level=high
