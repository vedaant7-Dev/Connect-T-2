name: Finalize Work Progress UI V106

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.head_ref == 'fix/work-progress-ui-v106-final' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/work-progress-ui-v106-final
          fetch-depth: 0
      - name: Remove remaining preview and verify TypeScript
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '<View style={styles.preview}><Text style={styles.previewLabel}>PREVIEW</Text>' mobile/screens/BroadcastCenterMediaScreen.tsx; then
            echo "Final UI cleanup already applied."
            exit 0
          fi
          python3 scripts/finalize_work_progress_ui_v106.py
          git diff --check
          cd mobile
          npm ci --ignore-scripts
          npm run typecheck
          cd ..
          git config user.name "Connect-T Automation"
          git config user.email "actions@users.noreply.github.com"
          git add mobile
          git commit -m "Finish preview removal and verify work progress UI"
          git push origin HEAD:fix/work-progress-ui-v106-final
