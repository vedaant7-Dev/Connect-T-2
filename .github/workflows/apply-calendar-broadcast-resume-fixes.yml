name: Apply Calendar Selection Polish

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'build/production-artifacts-20260730-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Correct selected calendar date contrast
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('mobile/components/AppDateTimePicker.tsx')
          text = path.read_text(encoding='utf-8')
          old = 'styles.dayCellText, active && styles.activeText, disabled && styles.disabledText'
          new = 'styles.dayCellText, active && styles.dayCellActiveText, disabled && styles.disabledText'
          if old not in text:
              raise SystemExit('calendar selected date style target not found')
          text = text.replace(old, new, 1)
          text = text.replace('dayCellText: { color: "#334155", fontSize: 12, fontFamily: "Inter_600SemiBold" }, activeText:', 'dayCellText: { color: "#334155", fontSize: 12, fontFamily: "Inter_600SemiBold" }, dayCellActiveText: { color: "white" }, activeText:', 1)
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "connect-t-build-bot"
          git config user.email "connect-t-build-bot@users.noreply.github.com"
          git add mobile/components/AppDateTimePicker.tsx
          git commit -m "Polish selected calendar date contrast [skip ci]"
          git push origin HEAD:main
