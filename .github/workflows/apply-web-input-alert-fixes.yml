name: Apply Web Input and Alert Fixes

on:
  push:
    branches:
      - fix/remove-complaint-age-row

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-complaint-age-row
          fetch-depth: 0

      - name: Apply focused fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "mobile/screens/AlertComposerScreen.tsx",
              'import { AppScrollView } from "@/components/AppScrollView";\n',
              'import { AppScrollView } from "@/components/AppScrollView";\nimport AppDateTimePicker from "@/components/AppDateTimePicker";\n',
          )
          replace_once(
              "mobile/screens/AlertComposerScreen.tsx",
              '{mode === "scheduled" ? <><Text style={styles.label}>{c("publishAt")} *</Text><TextInput style={styles.input} value={publishAtText} onChangeText={setPublishAtText} placeholder="2026-08-15 10:30" placeholderTextColor="#94A3B8" autoCapitalize="none" /><Text style={styles.help}>{c("dateHint")}</Text></> : null}',
              '{mode === "scheduled" ? <><Text style={styles.label}>{c("publishAt")} *</Text><AppDateTimePicker value={publishAtText} onChange={setPublishAtText} placeholder={c("selectDateTime")} minimumDate={new Date(Date.now() + 60_000)} accessibilityLabel={c("publishAt")} /><Text style={styles.help}>{c("dateHint")}</Text></> : null}',
          )
          replace_once(
              "mobile/screens/AlertComposerScreen.tsx",
              '{mode !== "draft" ? <><Text style={styles.label}>{c("expiry")}</Text><TextInput style={styles.input} value={expiryText} onChangeText={setExpiryText} placeholder="2026-08-16 18:00" placeholderTextColor="#94A3B8" autoCapitalize="none" /><Text style={styles.help}>{c("dateHint")}</Text></> : null}',
              '{mode !== "draft" ? <><Text style={styles.label}>{c("expiry")}</Text><AppDateTimePicker value={expiryText} onChange={setExpiryText} placeholder={c("selectDateTime")} minimumDate={new Date(Date.now() + 60_000)} accessibilityLabel={c("expiry")} /><Text style={styles.help}>{c("dateHint")}</Text></> : null}',
          )

          replace_once(
              "mobile/screens/BroadcastCenterScreen.tsx",
              'import { AppScrollView } from "@/components/AppScrollView";\n',
              'import { AppScrollView } from "@/components/AppScrollView";\nimport AppDateTimePicker from "@/components/AppDateTimePicker";\n',
          )
          replace_once(
              "mobile/screens/BroadcastCenterScreen.tsx",
              '<TextInput style={styles.input} value={scheduledAt} onChangeText={setScheduledAt} placeholder="YYYY-MM-DD HH:mm" placeholderTextColor="#94A3B8" autoCapitalize="none" />',
              '<AppDateTimePicker value={scheduledAt} onChange={setScheduledAt} placeholder="Select date and time" minimumDate={new Date(Date.now() + 60_000)} accessibilityLabel="Schedule date and time" />',
          )
          replace_once(
              "mobile/screens/BroadcastCenterScreen.tsx",
              'Leave blank to send in-app immediately. Scheduled broadcasts activate when the server next processes broadcast delivery.',
              'Leave blank to send in-app immediately. Use the picker to choose a future date and time.',
          )

          copy = Path("mobile/i18n/alertComposerCopy.ts")
          text = copy.read_text(encoding="utf-8")
          replacements = {
              '    dateHint: "Use YYYY-MM-DD HH:mm, for example 2026-08-15 10:30",\n': '    dateHint: "Choose a future date and time from the picker.",\n    selectDateTime: "Select date and time",\n',
              '    dateHint: "YYYY-MM-DD HH:mm वापरा, उदा. 2026-08-15 10:30",\n': '    dateHint: "पिकरमधून भविष्यातील दिनांक आणि वेळ निवडा.",\n    selectDateTime: "दिनांक आणि वेळ निवडा",\n',
              '    dateHint: "YYYY-MM-DD HH:mm का उपयोग करें, जैसे 2026-08-15 10:30",\n': '    dateHint: "पिकर से भविष्य की तारीख और समय चुनें।",\n    selectDateTime: "तारीख और समय चुनें",\n',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Translation replacement count was {count}: {old!r}")
              text = text.replace(old, new)
          copy.write_text(text, encoding="utf-8")

          replace_once(
              "render.yaml",
              '      - key: EXPO_PUBLIC_API_URL\n        value: https://newapp.e-bjp.in\n',
              '      - key: EXPO_PUBLIC_API_URL\n        fromService:\n          type: web\n          name: connect-t-2\n          envVarKey: RENDER_EXTERNAL_URL\n',
          )

          test = Path("mobile/test/web-input-and-scheduling.test.mjs")
          test.write_text(r'''import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import test from "node:test";

          const read = (path) => readFileSync(new URL(`../${path}`, import.meta.url), "utf8");

          test("web inputs do not use the browser black focus outline", () => {
            const css = read("global.css");
            assert.match(css, /input:focus/);
            assert.match(css, /outline:\s*none\s*!important/);
            assert.match(css, /box-shadow:\s*none\s*!important/);
          });

          test("official update and broadcast schedules use the shared date time picker", () => {
            const alertComposer = read("screens/AlertComposerScreen.tsx");
            const broadcasts = read("screens/BroadcastCenterScreen.tsx");
            const picker = read("components/AppDateTimePicker.tsx");
            assert.match(alertComposer, /AppDateTimePicker/);
            assert.doesNotMatch(alertComposer, /placeholder="2026-08-15 10:30"/);
            assert.match(broadcasts, /AppDateTimePicker/);
            assert.doesNotMatch(broadcasts, /placeholder="YYYY-MM-DD HH:mm"/);
            assert.match(picker, /type:\s*"datetime-local"/);
            assert.match(picker, /Select date and time/);
          });

          test("Render web export uses the sibling Render backend instead of stale Hostinger URL", () => {
            const render = read("../render.yaml");
            assert.match(render, /EXPO_PUBLIC_API_URL[\s\S]*fromService:[\s\S]*name: connect-t-2[\s\S]*envVarKey: RENDER_EXTERNAL_URL/);
            assert.doesNotMatch(render, /EXPO_PUBLIC_API_URL\n\s+value: https:\/\/newapp\.e-bjp\.in/);
          });
          ''', encoding="utf-8")

          workflow = Path(".github/workflows/apply-web-input-alert-fixes.yml")
          workflow.unlink()

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund

      - name: Run mobile regression tests
        working-directory: mobile
        run: npm run test:api

      - name: Run mobile TypeScript validation
        working-directory: mobile
        run: npm run typecheck

      - name: Export Expo web app
        working-directory: mobile
        run: npm run export:web

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/screens/AlertComposerScreen.tsx mobile/screens/BroadcastCenterScreen.tsx mobile/i18n/alertComposerCopy.ts mobile/test/web-input-and-scheduling.test.mjs render.yaml .github/workflows/apply-web-input-alert-fixes.yml
          git commit -m "Fix web input focus and add date time pickers"
          git push origin HEAD:fix/remove-complaint-age-row
