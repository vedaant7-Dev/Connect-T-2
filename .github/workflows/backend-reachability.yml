name: Backend Reachability Diagnostic

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/native-otp-screen-and-backend-fallback

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check configured API endpoints
        shell: bash
        run: |
          set +e
          for base in "https://newapp.e-bjp.in" "https://connect-t-2.onrender.com"; do
            echo "=== $base ==="
            getent ahosts "${base#https://}" || true
            curl -sS -L --connect-timeout 10 --max-time 30 -D - "$base/api/healthz" -o /tmp/body.txt
            status=$?
            echo "curl_status=$status"
            cat /tmp/body.txt 2>/dev/null || true
            echo
            curl -sS -L --connect-timeout 10 --max-time 30 -X POST \
              -H 'Content-Type: application/json' \
              -d '{"mobile":"9999999999","purpose":"login"}' \
              -D - "$base/api/auth/send-otp" -o /tmp/otp.txt
            status=$?
            echo "otp_curl_status=$status"
            cat /tmp/otp.txt 2>/dev/null || true
            echo
          done
