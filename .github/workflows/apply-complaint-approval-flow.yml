name: Apply Complaint Approval Flow

on:
  push:
    branches: [main]
    paths:
      - "scripts/apply_complaint_approval_flow.py"
      - ".github/workflows/apply-complaint-approval-flow.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply complaint workflow
        run: python3 scripts/apply_complaint_approval_flow.py

      - name: Validate patch
        run: git diff --check

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "Connect-T Automation"
          git config user.email "actions@users.noreply.github.com"
          git add mobile/app/'complaint'/'[id].tsx' backend/server.js
          git commit -m "Enforce complaint approval workflow"
          git push origin HEAD:main
