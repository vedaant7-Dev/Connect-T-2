name: Apply App Users Profile Fix

on:
  push:
    branches: [main]
    paths:
      - "scripts/apply_app_users_profile_fix.py"
      - ".github/workflows/apply-app-users-profile-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply App Users profile fixes
        run: python3 scripts/apply_app_users_profile_fix.py
      - name: Validate patch
        run: git diff --check
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "Connect-T Automation"
          git config user.email "actions@users.noreply.github.com"
          git add backend/internalCommunityAndUsersPatch.js mobile/app/super-admin/users.tsx mobile/app/super-admin/user-details.tsx mobile/app/super-admin/_layout.tsx mobile/lib/profilePhoto.ts
          git commit -m "Fix App Users photos and add full profile details"
          git push origin HEAD:main
