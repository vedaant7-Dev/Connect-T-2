name: Apply citizen updates batch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/citizen-updates-utility-complaints
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply source changes
        run: |
          python3 .github/scripts/apply_citizen_updates_batch.py
          python3 .github/scripts/fix_stale_contracts.py

      - name: Check patch formatting
        run: git diff --check

      - name: Validate backend
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Validate mobile source
        working-directory: mobile
        run: |
          npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          npm run test:api
          npm run typecheck

      - name: Commit validated batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix citizen updates, utility management and complaint uploads [batch-applied]"
          git push origin HEAD:fix/citizen-updates-utility-complaints
