name: Apply Work Progress UI V106

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'fix/work-progress-ui-v106' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/work-progress-ui-v106
          fetch-depth: 0
      - name: Apply UI order, cleanup and delete fixes
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'Complaint status summary stays at the top of Work Progress' 'mobile/app/(tabs)/admin.tsx' 2>/dev/null; then
            echo "Work Progress UI fixes already applied."
            exit 0
          fi
          python3 scripts/apply_work_progress_ui_v106.py
          git diff --check
          git config user.name "Connect-T Automation"
          git config user.email "actions@users.noreply.github.com"
          git add mobile
          git commit -m "Reorder work progress and simplify civic update UI"
          git push origin HEAD:fix/work-progress-ui-v106
