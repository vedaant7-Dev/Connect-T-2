name: Apply Global Media Action Policy

on:
  push:
    branches:
      - fix/app-users-release-v105
    paths:
      - ".github/workflows/apply-global-media-action-policy.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/app-users-release-v105
          fetch-depth: 0

      - name: Apply shared media action workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("mobile")
          viewer_path = root / "components/ComplaintMediaViewer.tsx"
          viewer = viewer_path.read_text()
          viewer = viewer.replace("  showInlineSaveAction = true,", "  showInlineSaveAction = false,", 1)
          viewer = viewer.replace("  showFullScreenShareAction = true,", "  showFullScreenShareAction = false,", 1)
          viewer_path.write_text(viewer)

          # Enforce the same policy at every explicit call site as well.
          for path in root.rglob("*.tsx"):
              text = path.read_text()
              updated = text.replace("showInlineSaveAction={true}", "showInlineSaveAction={false}")
              updated = updated.replace("showFullScreenShareAction={true}", "showFullScreenShareAction={false}")
              if updated != text:
                  path.write_text(updated)

          test_path = root / "test/complaint-media-viewer.test.mjs"
          tests = test_path.read_text()
          marker = 'test("media actions use share inline and save in the full-screen viewer"'
          if marker not in tests:
              tests += '''\n\ntest("media actions use share inline and save in the full-screen viewer", () => {\n  const viewer = read("components/ComplaintMediaViewer.tsx");\n  assert.match(viewer, /showInlineSaveAction = false/);\n  assert.match(viewer, /showInlineShareAction = true/);\n  assert.match(viewer, /showFullScreenSaveAction = true/);\n  assert.match(viewer, /showFullScreenShareAction = false/);\n});\n'''
              test_path.write_text(tests)
          PY

          grep -q 'showInlineSaveAction = false' mobile/components/ComplaintMediaViewer.tsx
          grep -q 'showFullScreenShareAction = false' mobile/components/ComplaintMediaViewer.tsx
          ! grep -R --include='*.tsx' -n 'showInlineSaveAction={true}' mobile
          ! grep -R --include='*.tsx' -n 'showFullScreenShareAction={true}' mobile
          git diff --check

      - name: Verify mobile tests and TypeScript
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          npm ci --include=dev --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          npm test
          npx tsc --noEmit

      - name: Commit media workflow
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Media action workflow already applied."
            exit 0
          fi
          git config user.name "Connect-T Automation"
          git config user.email "actions@users.noreply.github.com"
          git add mobile/components/ComplaintMediaViewer.tsx mobile/test/complaint-media-viewer.test.mjs
          git commit -m "Apply global media save and share workflow"
          git push origin HEAD:fix/app-users-release-v105
