name: Apply Final Citizen Fixes V106

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'fix/final-citizen-role-news-v106' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-citizen-role-news-v106
          fetch-depth: 0
      - name: Apply requested fixes
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'FINAL_CITIZEN_FIXES_V106' backend/jobPortalSessionRecoveryPatch.js 2>/dev/null; then
            echo "Final citizen fixes already applied."
            exit 0
          fi
          python3 scripts/apply_final_citizen_fixes_v106.py
          git diff --check
          cd mobile
          node --test test/final-citizen-fixes-v106.test.mjs
          cd ..
          git config user.name "Connect-T Automation"
          git config user.email "actions@users.noreply.github.com"
          git add backend mobile
          git commit -m "Fix role switching and upgrade citizen news feed"
          git push origin HEAD:fix/final-citizen-role-news-v106
