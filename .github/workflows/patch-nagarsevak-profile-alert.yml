name: Patch Nagarsevak Profile Alert

on:
  push:
    branches:
      - fix/app-users-release-v105
    paths:
      - ".github/workflows/patch-nagarsevak-profile-alert.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/app-users-release-v105
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Hide Alerts and News for Nagarsevak profile only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("mobile/screens/CivicProfileScreen.tsx")
          text = path.read_text(encoding="utf-8")
          old = '''          <TouchableOpacity style={styles.actionRow} onPress={() => router.push("/alert/list" as any)}>
            <View style={styles.actionIcon}><Feather name="bell" size={18} color={ORANGE} /></View><View style={styles.actionText}><Text style={styles.actionTitle}>{c("alerts")}</Text><Text style={styles.actionSub}>{c("alertsSub")}</Text></View><Feather name="chevron-right" size={18} color="#94A3B8" />
          </TouchableOpacity>'''
          new = '''          {user.role !== "nagarsevak" ? <TouchableOpacity style={styles.actionRow} onPress={() => router.push("/alert/list" as any)}>
            <View style={styles.actionIcon}><Feather name="bell" size={18} color={ORANGE} /></View><View style={styles.actionText}><Text style={styles.actionTitle}>{c("alerts")}</Text><Text style={styles.actionSub}>{c("alertsSub")}</Text></View><Feather name="chevron-right" size={18} color="#94A3B8" />
          </TouchableOpacity> : null}'''
          if text.count(old) != 1:
              raise SystemExit(f"Expected one Alerts & News profile row, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

          grep -n 'user.role !== "nagarsevak"' mobile/screens/CivicProfileScreen.tsx

      - name: Validate mobile TypeScript
        working-directory: mobile
        run: |
          npm ci --include=dev --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          npm run typecheck

      - name: Commit the profile cleanup and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-nagarsevak-profile-alert.yml
          git add mobile/screens/CivicProfileScreen.tsx
          git commit -m "Hide Alerts and News from Nagarsevak profile"
          git push origin HEAD:fix/app-users-release-v105
