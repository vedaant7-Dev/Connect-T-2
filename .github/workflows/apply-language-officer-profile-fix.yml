name: Apply Officer Language Profile Fix

on:
  push:
    branches:
      - fix/english-officer-names-profile-language

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[language-profile-patch]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/english-officer-names-profile-language
          fetch-depth: 0

      - name: Apply focused source changes
        run: |
          python - <<'PY'
          from pathlib import Path

          officers = Path('mobile/app/super-admin/officers.tsx')
          text = officers.read_text()
          old = 'placeholder="Search Marathi name, mobile or designation"'
          new = 'placeholder="Search English name, mobile or designation"'
          if old not in text:
              raise SystemExit('Officer search placeholder not found')
          officers.write_text(text.replace(old, new, 1))

          profile = Path('mobile/screens/LocalizedJobPortalProfileScreen.tsx')
          text = profile.read_text()
          text = text.replace(
              'import { useLanguage } from "@/context/LanguageContext";',
              'import { languageOptions, useLanguage } from "@/context/LanguageContext";',
              1,
          )
          text = text.replace(
              '  const { language } = useLanguage();',
              '  const { language, setLanguage } = useLanguage();',
              1,
          )
          text = text.replace(
              '  const [showRequest, setShowRequest] = useState(false);',
              '  const [showRequest, setShowRequest] = useState(false);\n  const [languageVisible, setLanguageVisible] = useState(false);',
              1,
          )
          text = text.replace(
              '  const targetRoleLabel = isEmployer ? c("jobSeeker") : c("employer");',
              '  const targetRoleLabel = isEmployer ? c("jobSeeker") : c("employer");\n  const languageTitle = language === "mr" ? "ॲप भाषा" : language === "hi" ? "ऐप भाषा" : "App language";\n  const languageSubtitle = language === "mr" ? "Connect-T ची भाषा बदला" : language === "hi" ? "Connect-T की भाषा बदलें" : "Change the language used across Connect-T";\n  const selectLanguageTitle = language === "mr" ? "भाषा निवडा" : language === "hi" ? "भाषा चुनें" : "Select language";',
              1,
          )

          anchor = '<Text style={s.sectionTitle}>{c("accountActions").toUpperCase()}</Text><View style={s.card}><TouchableOpacity style={s.actionRow} onPress={accountActions.requestCivicPortal}>'
          replacement = '<Text style={s.sectionTitle}>{c("accountActions").toUpperCase()}</Text><View style={s.card}><TouchableOpacity style={s.actionRow} onPress={() => setLanguageVisible(true)} accessibilityRole="button"><Feather name="globe" size={16} color={ORANGE} /><View style={{ flex: 1 }}><Text style={s.actionTitle}>{languageTitle}</Text><Text style={s.actionSub}>{languageOptions.find((option) => option.code === language)?.nativeLabel} · {languageSubtitle}</Text></View><Feather name="chevron-right" size={17} color="#CBD5E1" /></TouchableOpacity><TouchableOpacity style={s.actionRow} onPress={accountActions.requestCivicPortal}>'
          if anchor not in text:
              raise SystemExit('Job Portal account actions anchor not found')
          text = text.replace(anchor, replacement, 1)

          modal_anchor = '      <Modal visible={showRequest} transparent animationType="slide" onRequestClose={() => setShowRequest(false)}>'
          language_modal = '''      <Modal visible={languageVisible} transparent animationType="slide" onRequestClose={() => setLanguageVisible(false)}>
        <View style={s.sheetOverlay}><View style={[s.sheet, { paddingBottom: Math.max(insets.bottom, 12) + 12 }]}>
          <View style={s.handle} /><View style={s.sheetHeader}><View style={{ flex: 1 }}><Text style={s.sheetTitle}>{selectLanguageTitle}</Text><Text style={s.sheetSub}>{languageSubtitle}</Text></View><TouchableOpacity style={s.close} onPress={() => setLanguageVisible(false)} accessibilityLabel={c("cancel")}><Feather name="x" size={18} color="#64748B" /></TouchableOpacity></View>
          <AppScrollView style={{ maxHeight: 420 }} contentContainerStyle={{ paddingBottom: 22 }}>
            {languageOptions.map((option) => <TouchableOpacity key={option.code} style={[s.actionRow, language === option.code && { backgroundColor: "#FFF7ED" }]} onPress={() => { void setLanguage(option.code); setLanguageVisible(false); }} accessibilityRole="button" accessibilityState={{ selected: language === option.code }}><Feather name="globe" size={16} color={language === option.code ? ORANGE : "#64748B"} /><View style={{ flex: 1 }}><Text style={[s.actionTitle, language === option.code && { color: ORANGE }]}>{option.nativeLabel}</Text><Text style={s.actionSub}>{option.label}</Text></View>{language === option.code ? <Feather name="check-circle" size={18} color={ORANGE} /> : null}</TouchableOpacity>)}
          </AppScrollView>
        </View></View>
      </Modal>

'''
          if modal_anchor not in text:
              raise SystemExit('Job Portal role request modal anchor not found')
          text = text.replace(modal_anchor, language_modal + modal_anchor, 1)
          profile.write_text(text)

          test = Path('mobile/test/profile-language-and-officer-names.test.mjs')
          test.write_text('''import assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\nimport test from "node:test";\n\nconst read = (path) => readFileSync(new URL(`../${path}`, import.meta.url), "utf8");\n\ntest("official Nagarsevak roster uses English-script display names", () => {\n  const names = read("data/nagarsevakEnglishNames.ts");\n  const hook = read("hooks/useNagarsevakAssignments.ts");\n  const screen = read("app/super-admin/officers.tsx");\n  assert.match(names, /7: "Rasal Archana Charan"/);\n  assert.match(names, /65: "Rohit Raju Mahadik"/);\n  assert.match(hook, /officialNagarsevakEnglishName/);\n  assert.match(hook, /originalName/);\n  assert.match(screen, /Search English name, mobile or designation/);\n});\n\ntest("every role profile exposes the persisted app language selector", () => {\n  const civic = read("screens/CivicProfileScreen.tsx");\n  const jobs = read("screens/LocalizedJobPortalProfileScreen.tsx");\n  assert.match(civic, /languageOptions/);\n  assert.match(civic, /setLanguageVisible\(true\)/);\n  assert.match(jobs, /languageOptions/);\n  assert.match(jobs, /setLanguageVisible\(true\)/);\n  assert.match(jobs, /void setLanguage\(option\.code\)/);\n});\n''')
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/apply-language-officer-profile-fix.yml

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile .github/workflows/apply-language-officer-profile-fix.yml
          git commit -m "Add English officer names and profile language controls [language-profile-patch]"
          git push origin HEAD:fix/english-officer-names-profile-language
