name: Regenerate Frontend Locks

on:
  push:
    branches:
      - feat/render-expo-web-testing

permissions:
  contents: write

jobs:
  update-lockfiles:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/render-expo-web-testing
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate mobile lockfile
        working-directory: mobile
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Regenerate client lockfile
        working-directory: client
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfiles and remove generator
        run: |
          rm -f .github/workflows/regenerate-frontend-locks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package.json mobile/package-lock.json client/package.json client/package-lock.json .github/workflows/regenerate-frontend-locks.yml
          git commit -m "Regenerate patched frontend lockfiles"
          git push origin HEAD:feat/render-expo-web-testing
