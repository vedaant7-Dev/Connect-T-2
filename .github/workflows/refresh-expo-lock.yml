name: Refresh Expo Lockfile

on:
  push:
    branches:
      - fix/app-users-release-v105
    paths:
      - mobile/package.json

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/app-users-release-v105

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Regenerate package lock
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund

      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- mobile/package-lock.json; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          git commit -m "Refresh Expo dependency lockfile"
          git push origin HEAD:fix/app-users-release-v105
