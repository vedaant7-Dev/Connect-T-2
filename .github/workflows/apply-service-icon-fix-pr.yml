name: Apply service icon migration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/service-category-icons'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/service-category-icons
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply icon corrections
        run: node scripts/apply-service-icon-fix.cjs
      - name: Commit corrected icons
        shell: bash
        run: |
          rm -f .github/workflows/apply-service-icon-fix.yml
          rm -f .github/workflows/apply-service-icon-fix-pr.yml
          rm -f scripts/apply-service-icon-fix.cjs
          git config user.name "connect-t-release-bot"
          git config user.email "connect-t-release-bot@users.noreply.github.com"
          git add mobile .github/workflows/apply-service-icon-fix.yml .github/workflows/apply-service-icon-fix-pr.yml scripts/apply-service-icon-fix.cjs
          git commit -m "Correct civic service symbols and reduce icon size"
          git push origin HEAD:fix/service-category-icons
