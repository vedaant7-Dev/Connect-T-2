name: Apply Complaint Media Viewer

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'feature/complaint-media-viewer' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/complaint-media-viewer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and validate complaint media viewer
        shell: bash
        run: |
          set -euo pipefail
          if [ -f mobile/components/ComplaintMediaViewer.tsx ]; then
            echo "Complaint media viewer is already applied."
            exit 0
          fi
          cd mobile
          npx expo install expo-video expo-file-system expo-sharing expo-media-library
          cd ..
          python3 scripts/apply_complaint_media_viewer.py
          cd mobile
          npm run test:api
          npm run typecheck
          npx expo config --type public >/tmp/connect-t-expo-config.json
          cd ..
          git config user.name "Connect-T Automation"
          git config user.email "actions@users.noreply.github.com"
          git add mobile
          git commit -m "[media-viewer-applied] Add in-app complaint media viewer"
          git push origin HEAD:feature/complaint-media-viewer
