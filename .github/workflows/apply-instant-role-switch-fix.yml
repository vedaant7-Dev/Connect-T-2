name: Apply Instant Job Role Switch Fix

# PR_TRIGGER_INSTANT_ROLE_SWITCH_V3
on:
  push:
    branches:
      - main
    paths:
      - scripts/apply_instant_role_switch_fix.py
      - .github/workflows/apply-instant-role-switch-fix.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - scripts/apply_instant_role_switch_fix.py
      - .github/workflows/apply-instant-role-switch-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - name: Apply role switch UI fix
        run: python3 scripts/apply_instant_role_switch_fix.py
      - name: Repair focused regression fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("mobile/test/job-civic-profile-consistency.test.mjs")
          text = path.read_text(encoding="utf-8")
          marker = 'test("unified Job Portal profile preserves fields and supports instant role switching", () => {\n  const jobs = read("screens/LocalizedJobPortalProfileScreen.tsx");'
          replacement = marker + '\n  const route = read("app/jobs/(tabs)/profile.tsx");'
          if marker in text and replacement not in text:
              text = text.replace(marker, replacement, 1)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Validate changes
        run: |
          git diff --check
          cd mobile
          node --test test/job-civic-profile-consistency.test.mjs
      - name: Commit generated fix
        run: |
          if git diff --quiet; then
            echo "No generated changes required."
            exit 0
          fi
          git config user.name "Connect-T Automation"
          git config user.email "actions@users.noreply.github.com"
          git add mobile
          git commit -m "Fix instant Job Portal role switching"
          git push origin HEAD:${TARGET_BRANCH}
