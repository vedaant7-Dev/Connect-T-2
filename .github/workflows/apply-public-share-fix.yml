name: Apply Public Broadcast Share Fix

on:
  push:
    branches: [main]
    paths:
      - "scripts/apply_public_share_fix.py"
      - ".github/workflows/apply-public-share-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused share and community text fixes
        run: python3 scripts/apply_public_share_fix.py
      - name: Validate patch
        run: git diff --check
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "Connect-T Automation"
          git config user.email "actions@users.noreply.github.com"
          git add mobile/screens/BroadcastCenterMediaScreen.tsx mobile/screens/NagarsevakCommunityScreen.tsx
          git commit -m "Fix broadcast share links and community input text"
          git push origin HEAD:main
