name: Build Latest Connect-T Artifacts

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout latest source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Build standalone ARM64 APK
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_API_URL: https://newapp.e-bjp.in
        run: |
          chmod +x gradlew
          ./gradlew assembleStandalone --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Prepare deliverables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          APK_PATH="$(find mobile/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" output/Connect-T-Latest-Standalone.apk
          printf 'Source commit: %s\nBuilt at (UTC): %s\nAuthentication: unified Civic + Job Portal login\n' "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > backend/BUILD_INFO.txt
          (
            cd backend
            zip -r ../output/Connect-T-Backend-Latest.zip . \
              -x 'node_modules/*' '.env' '.env.*' 'uploads/*' '*.log' '*.zip'
          )
          ls -lh output

      - name: Upload latest APK
        uses: actions/upload-artifact@v4
        with:
          name: Connect-T-Latest-APK
          path: output/Connect-T-Latest-Standalone.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload latest backend
        uses: actions/upload-artifact@v4
        with:
          name: Connect-T-Latest-Backend
          path: output/Connect-T-Backend-Latest.zip
          if-no-files-found: error
          retention-days: 7
